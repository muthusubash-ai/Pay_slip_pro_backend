# ==============================================================================
# PAYSLIP PRO - NGINX CONFIGURATION FOR HOSTINGER KVM 1 LINUX VPS
# Copy to: /etc/nginx/sites-available/payslippro.conf
# Enable: ln -s /etc/nginx/sites-available/payslippro.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Upstream to Gunicorn Unix Socket
upstream payslippro_backend {
    server unix:/run/payslippro.sock fail_timeout=0;
}

# HTTP Server (Redirect all HTTP to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificates (Certbot will automatically populate/update these paths)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # Maximum file upload size (logos & employee face scans)
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

    # 1. Frontend: Static Build Directory (React 19 + Vite)
    root /var/www/payslippro/frontend/dist;
    index index.html;

    # Cache hashed production assets for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 2. Django Admin Static Files
    location /static/ {
        alias /var/www/payslippro/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 3. User Media Uploads (Company logos, employee avatars)
    location /media/ {
        alias /var/www/payslippro/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 4. Backend API & Django Admin Routes -> Proxy to Gunicorn Socket
    location ~ ^/(api|admin)/ {
        proxy_pass http://payslippro_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Disable buffering for real-time responsiveness
        proxy_buffering off;
    }

    # 5. Frontend SPA Route Fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logs
    access_log /var/log/nginx/payslippro_access.log;
    error_log /var/log/nginx/payslippro_error.log warn;
}
